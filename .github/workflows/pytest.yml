name: Run Tests and Coverage

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Cache pip dependencies
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .  
      
      - name: Install graphviz
        run: |
          source venv/bin/activate
          sudo apt-get install graphviz

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=${{ github.workspace }}:${{ github.workspace }}" >> $GITHUB_ENV

      - name: Verify PYTHONPATH
        run: |
          echo "PYTHONPATH is: $PYTHONPATH"

      - name: Install Playwright Browsers
        run: |
          source venv/bin/activate
          playwright install --with-deps 

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull TinyLlama Model
        run: |
          ollama pull tinyllama

      - name: Verify Ollama Installation
        run: |
          ollama list || echo "Ollama is not installed or the model is missing!"

      # - name: Start Ollama
      #   run: |
      #     ollama serve &
      #     sleep 5

      - name: Start Flask app
        run: |
          source venv/bin/activate
          echo %PYTHONPATH%
          python src/frontend/app.py &
          sleep 10

      - name: Run tests with coverage
        run: |
          source venv/bin/activate
          echo %PYTHONPATH%
          pytest --cov=src --ignore=src/testing/tests/workflow/test_crud_audit.py 

      - name: Upload coverage report to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml